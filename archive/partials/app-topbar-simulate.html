<div id="topbar" class="topbar">
    <div class="topbar-left">
        <h1 class="topbar-app-title">StarShade Lab</h1>
        <div class="topbar-divider"></div>
        <div class="mode-toggle">
            <button type="button" id="btn-mode-linkage" data-app-nav-mode="linkage" class="topbar-btn" title="Linkage Design Mode">⚙️</button>
            <button type="button" id="btn-mode-solar" data-app-nav-mode="solar-design" class="topbar-btn" title="Solar/Electrical Design Mode">⚡</button>
            <button type="button" id="btn-mode-simulate" data-app-nav-mode="solar-simulate" class="topbar-btn active" title="Solar 3D Simulation Mode">▶</button>
        </div>
    </div>
    <div class="topbar-center topbar-simulate-center sim-topbar-row-controls">
        <div class="sim-ctrl-playback">
            <button id="playPauseButton" class="topbar-btn sim-play-btn" title="Play/Pause (Space)">▶</button>
            <input type="range" id="speedSlider" class="topbar-sim-slider" min="1" max="100" value="10" title="Simulation speed">
            <span class="topbar-sim-speed" id="speedLabel">1x</span>
            <button id="resetSimulationBtn" class="topbar-btn sim-reset-btn" title="Reset simulation">↺</button>
        </div>
        <div class="sim-celestial-bar sim-celestial-topbar">
            <span class="sim-celestial-clock" id="simCelestialClock">12:00 PM</span>
            <div class="sim-sun-track">
                <div class="sim-sun-track-bg">
                    <div id="sim-sun-indicator" class="sim-sun">☀️</div>
                </div>
                <div class="sim-sun-labels">
                    <span>Sunrise</span><span>Noon</span><span>Sunset</span>
                </div>
            </div>
        </div>
        <span class="time-display sim-time-inline" id="timeDisplay">0 hours (Day 1, 00:00)</span>
        <div class="sim-ctrl-weather">
            <select id="weatherDifficulty" class="sim-select" title="Weather condition">
                <option value="clear" selected>☀️ Clear</option>
                <option value="easy">🌤️ Easy</option>
                <option value="medium">⛅ Medium</option>
                <option value="hard">🌦️ Hard</option>
            </select>
        </div>
    </div>
    <div class="topbar-right">
        <div class="topbar-file-controls">
            <button type="button" class="topbar-btn topbar-file-btn topbar-file-save" id="btn-sim-save-top" title="Save circuit (Ctrl+S)">💾 Save</button>
            <button type="button" class="topbar-btn topbar-file-btn topbar-file-load" id="btn-sim-load-top" title="Load circuit">📂 Load</button>
            <button type="button" class="topbar-btn topbar-file-btn topbar-file-export" id="btn-sim-export-top" title="Export JSON">📤 Export</button>
            <button type="button" class="topbar-btn topbar-file-btn topbar-file-import" id="btn-sim-import-top" title="Import JSON">📥 Import</button>
        </div>
        <div class="topbar-divider"></div>
        <button type="button" class="topbar-btn topbar-icon-btn" id="btn-sim-build-guide-top" title="Unified build guide (structure + electrical)">📋</button>
        <button type="button" class="topbar-btn topbar-icon-btn" id="btn-sim-design-top" title="Edit in Solar Designer">✏️ Designer</button>
    </div>
</div>
