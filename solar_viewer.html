<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System View</title>
    <script>
        // Entry point for embeddable read-only schematics.
        // Preserves ?config=, ?title=, and other query params; forces embed mode.
        (function () {
            const params = new URLSearchParams(window.location.search);
            params.set('embed', '1');
            const base = new URL('index.html', window.location.href);
            base.hash = '#/solar/design';
            base.search = params.toString();
            window.location.replace(base.toString());
        })();
    </script>
</head>
<body>
    <p style="font-family: system-ui, sans-serif; color: #7a8fa8; padding: 2rem;">Loading schematic…</p>
</body>
</html>
