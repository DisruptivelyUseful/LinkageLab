<!-- Hardware Assembly Detail Modal -->
<div id="hardware-detail-modal">
    <div class="hw-container">
        <div class="hw-header">
            <h1>HARDWARE ASSEMBLY DETAIL</h1>
            <div class="hw-header-controls">
                <label class="hw-header-field">Assembly
                    <select id="hw-assembly-select">
                        <option value="outerVBeam">Outer V-Beam</option>
                        <option value="innerVBeam">Inner V-Beam</option>
                        <option value="hCenter">H-Beam Center</option>
                        <option value="vCenter">V-Beam Center</option>
                    </select>
                </label>
                <label class="hw-header-field hw-explode-field">Explode
                    <input type="range" id="hw-explode-slider" min="0" max="100" step="1" value="0">
                    <span id="hw-explode-value">0%</span>
                </label>
                <label class="hw-header-field hw-fold-field">Fold
                    <input type="range" id="hw-fold-slider" min="5" max="175" step="0.1" value="90">
                    <span id="hw-fold-value">90°</span>
                </label>
            </div>
            <button class="hw-close" onclick="closeHardwareDetail()">&times;</button>
        </div>
        <div class="hw-body">
            <div class="hw-viewport"><canvas id="hw-detail-canvas"></canvas></div>
            <div class="hw-editor">
                <div class="hw-editor-toolbar">
                    <select id="hw-add-type">
                        <option value="bolt">Bolt</option>
                        <option value="bushing">Bushing</option>
                        <option value="washer">Washer</option>
                        <option value="lockWasher">Lock Washer</option>
                        <option value="nut">Nut</option>
                        <option value="rivetNut">Rivet Nut</option>
                        <option value="beam">Beam</option>
                        <option value="bracket">Bracket</option>
                    </select>
                    <select id="hw-add-axis">
                        <option value="center">Center (stack gap)</option>
                        <option value="right">Right (+ from center)</option>
                        <option value="left">Left (− from center)</option>
                        <option value="up">Up (+ from center)</option>
                        <option value="down">Down (− from center)</option>
                    </select>
                    <button class="hw-add-btn" onclick="hwAddPart()">+ Add Part</button>
                </div>
                <div class="hw-editor-toolbar hw-mirror-toolbar">
                    <span class="hw-copy-label">Mirror stacks</span>
                    <label class="hw-mirror-opt"><input type="checkbox" id="hw-mirror-right-left"> Right ↔ Left</label>
                    <label class="hw-mirror-opt"><input type="checkbox" id="hw-mirror-up-down"> Up ↔ Down</label>
                </div>
                <div class="hw-editor-toolbar hw-copy-toolbar">
                    <span class="hw-copy-label">Copy hardware from</span>
                    <select id="hw-copy-source" title="Copy all hardware parts from another assembly into this one">
                        <option value="outerVBeam">Outer V-Beam</option>
                        <option value="innerVBeam">Inner V-Beam</option>
                        <option value="vCenter">V-Center</option>
                        <option value="hCenter">H-Center</option>
                    </select>
                    <button class="hw-add-btn" onclick="hwCopyHardwareFromSelected()">Copy &rarr;</button>
                </div>
                <div id="hw-detail-parts" class="hw-parts-list"></div>
            </div>
        </div>
    </div>
</div>
