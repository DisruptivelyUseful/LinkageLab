        <div class="group collapsed" data-group="costs">
            <button type="button" class="group-title">Costs</button>
            <div class="group-content">
                <div class="ctrl-row">
                    <button type="button" class="btn-sm btn-block" data-open-bom title="Open the bill of materials drawer">Open Bill of Materials</button>
                </div>
                <div class="ctrl-row rule-above">
                    <label class="chk-label"><input type="checkbox" id="chk-auto-lumber-pricing" checked> Auto-scale lumber by volume</label>
                </div>
                <div class="hint">When enabled, beam costs scale proportionally based on volume</div>
                <!-- Reference Beam Pricing (for auto mode). unit-converter rewrites the in/ft spans in here. -->
                <div id="ref-beam-pricing" class="sub-block">
                    <div class="subhead">Reference Beam (for volume scaling)</div>
                    <div class="ref-row">
                        <span class="ref-label">Width × Thick</span>
                        <input type="number" id="nb-ref-beam-w" value="3.5" step="0.25" min="0.5" max="12" class="nb-xs" title="Reference beam width (inches)">
                        <span class="x">×</span>
                        <input type="number" id="nb-ref-beam-t" value="1.5" step="0.25" min="0.5" max="12" class="nb-xs" title="Reference beam thickness (inches)">
                        <span class="unit">in</span>
                    </div>
                    <div class="ref-row">
                        <span class="ref-label">Length</span>
                        <input type="number" id="nb-ref-beam-len" value="8" step="1" min="1" max="24" class="nb-xs" title="Reference beam length (feet)">
                        <span class="unit">ft</span>
                    </div>
                    <div class="ref-row">
                        <span class="ref-label">Price</span>
                        <span class="unit">$</span>
                        <input type="number" id="nb-ref-beam-price" value="5.48" step="0.01" min="0.01" class="nb-xs" title="Reference beam price">
                    </div>
                    <div id="ref-price-per-cu-in" class="hint hint-right"></div>
                </div>
                <div class="subhead">Per-beam pricing <span id="pricing-mode-label" class="subhead-note">(auto-calculated)</span></div>
                <div class="cost-grid">
                    <label for="nb-cost-hbeam">H-Beam <span id="cost-h-spec" class="spec">8' × 3.5×1.5"</span></label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-hbeam" value="12.00" step="0.01"></div>
                    <label for="nb-cost-vbeam">V-Beam <span id="cost-v-spec" class="spec">8' × 1.5×2.5"</span></label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-vbeam" value="10.00" step="0.01"></div>
                    <label for="nb-cost-brack">Bracket</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-brack" value="5.00" step="0.01"></div>
                    <label for="nb-cost-solar">Solar Panel</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-solar" value="150.00" step="0.01"></div>
                </div>
                <div class="subhead rule-above">Bolt Pricing</div>
                <!-- Single bolt pricing (when stack is even or <=2) -->
                <div id="bolt-cost-single" class="cost-grid">
                    <label for="nb-cost-bolt-v">V-Stack Bolt</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-v" value="0.75" step="0.01"></div>
                    <label for="nb-cost-bolt-h">H-Center Bolt</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-h" value="0.75" step="0.01"></div>
                    <label for="nb-cost-bolt-hpivot">H-Pivot Bolt</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-hpivot" value="0.75" step="0.01"></div>
                </div>
                <!-- Split bolt pricing (when V-stack > 2 and odd) -->
                <div id="bolt-cost-split" style="display:none;">
                    <div class="cost-grid">
                        <label for="nb-cost-bolt-vinner">Inner Bolt (Long)</label>
                        <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-vinner" value="0.75" step="0.01"></div>
                        <label for="nb-cost-bolt-vouter">Outer Bolt (Short)</label>
                        <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-vouter" value="0.50" step="0.01"></div>
                        <label for="nb-cost-bolt-h2">H-Center Bolt</label>
                        <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-h2" value="0.75" step="0.01"></div>
                        <label for="nb-cost-bolt-hpivot2">H-Pivot Bolt</label>
                        <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-bolt-hpivot2" value="0.75" step="0.01"></div>
                    </div>
                </div>
                <div id="bolt-cost-info" class="hint"></div>
                <div class="subhead rule-above">Washer Pricing</div>
                <div class="cost-grid">
                    <label for="nb-cost-washer-v">V-Stack Washer</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-washer-v" value="0.10" step="0.01"></div>
                    <label for="nb-cost-washer-h">H-Stack Washer</label>
                    <div class="money"><span class="unit">$</span><input type="number" id="nb-cost-washer-h" value="0.10" step="0.01"></div>
                </div>
            </div>
        </div>
