    <div class="topbar-center">
        <div class="topbar-cluster topbar-fold-row">
            <label class="topbar-label" for="nb-fold">Fold</label>
            <input type="range" id="sl-fold" min="5" max="175" step="0.1" title="Fold angle" aria-label="Fold angle">
            <input type="number" id="nb-fold" class="topbar-fold-input" min="5" max="175" step="0.1" title="Fold angle (degrees)" aria-label="Fold angle in degrees">
            <span class="topbar-deg" aria-hidden="true">°</span>
        </div>
        <div class="topbar-divider"></div>
        <div class="topbar-cluster topbar-anim">
            <button type="button" id="btn-anim-fold" class="topbar-btn btn-anim-fold" title="Fold to closed position"><span aria-hidden="true">◀</span> Fold</button>
            <button type="button" id="btn-anim-unfold" class="topbar-btn btn-anim-unfold" title="Unfold to open position">Unfold <span aria-hidden="true">▶</span></button>
        </div>
        <div class="topbar-divider"></div>
        <div class="topbar-cluster topbar-transport">
            <button type="button" id="btn-anim-play" class="topbar-btn" title="Play fold animation (Space)"><span aria-hidden="true">▶</span> Play</button>
            <button type="button" id="btn-anim-pause" class="topbar-btn" title="Pause fold animation (Space)"><span aria-hidden="true">⏸</span> Pause</button>
            <button type="button" id="btn-anim-reverse" class="topbar-btn" title="Reverse animation direction"><span aria-hidden="true">⟲</span> Reverse</button>
        </div>
    </div>
