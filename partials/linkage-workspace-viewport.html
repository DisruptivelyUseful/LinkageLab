<button id="sidebar-toggle">◀</button>
<div id="viewport">
    <canvas id="canvas-webgl" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
    <canvas id="canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none;"></canvas>
    <div id="toast"></div>
    <!-- Build Steps: caption overlay and transport bar (shown in build mode) -->
    <div id="bs-caption" class="bs-caption" style="display:none;">
        <div class="bs-caption-head"><span id="bs-caption-index" class="bs-caption-index"></span><span id="bs-caption-title" class="bs-caption-title"></span><span id="bs-caption-repeat" class="bs-caption-repeat" style="display:none;"></span></div>
        <div id="bs-caption-notes" class="bs-caption-notes"></div>
    </div>
    <div id="build-steps-bar" class="bs-bar" style="display:none;">
        <div id="bs-chips" class="bs-chips" aria-label="Steps"></div>
        <div class="bs-bar-row">
            <button id="bs-tr-first" class="bs-tr-btn" title="First step">⏮</button>
            <button id="bs-tr-prev" class="bs-tr-btn" title="Previous step">◀</button>
            <button id="bs-tr-play" class="bs-tr-btn bs-tr-play" title="Play / pause (Space)">▶</button>
            <button id="bs-tr-next" class="bs-tr-btn" title="Next step">▶|</button>
            <button id="bs-tr-last" class="bs-tr-btn" title="Last step">⏭</button>
            <input type="range" id="bs-tr-scrub" class="bs-tr-scrub" min="0" max="1000" value="0" title="Scrub the current step">
            <span id="bs-tr-pos" class="bs-tr-pos">0 / 0</span>
            <label class="bs-tr-label" title="Repeat the sequence"><input type="checkbox" id="bs-tr-loop"> Loop</label>
            <select id="bs-tr-speed" class="bs-tr-speed" title="Playback speed">
                <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option>
            </select>
            <button id="bs-tr-exit" class="bs-tr-btn bs-tr-exit" title="Exit build mode (Esc)">✕</button>
        </div>
    </div>
    <div id="perf-stats" style="position:absolute; bottom:6px; left:6px; font:10px/1.3 monospace; color:rgba(255,255,255,0.45); pointer-events:none; z-index:5; text-shadow:0 1px 2px rgba(0,0,0,0.5);"></div>
</div>

<!-- Solar Design Canvas (hidden by default) -->
