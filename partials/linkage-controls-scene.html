        <div class="group" data-group="scene">
            <button type="button" class="group-title">Scene &amp; Display</button>
            <div class="group-content">
                <div class="chk-grid">
                    <label class="chk-label" title="Draw the bolt brackets (K)"><input type="checkbox" id="chk-brack" checked> Brackets</label>
                    <label class="chk-label" title="Draw bolts (B)"><input type="checkbox" id="chk-bolts"> Bolts</label>
                    <label class="chk-label" title="High-detail hardware assemblies"><input type="checkbox" id="chk-hw-full-detail"> Full Detail</label>
                    <label class="chk-label" title="Enforce collision limits (P)"><input type="checkbox" id="chk-collide"> Physics Check</label>
                    <label class="chk-label" title="Higher-contrast colours"><input type="checkbox" id="chk-high-contrast"> High Contrast</label>
                    <label class="chk-label" title="Enable sun shadows"><input type="checkbox" id="chk-shadows"> Shadows</label>
                </div>
                <div class="ctrl-row rule-above">
                    <div class="ctrl-head"><span>Sun (time of day)</span><span id="sun-time-display" class="unit unit-mono">12:00</span></div>
                    <div class="input-wrap">
                        <input type="range" id="sl-sun-time" min="0" max="100" value="50" step="0.1" title="Time of day (sunrise to sunset)" aria-label="Time of day">
                    </div>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-head"><span>Structure Rotation (Y)</span><span class="unit">°</span></div>
                    <div class="input-wrap">
                        <input type="range" id="sl-structure-rotation" min="-180" max="180" step="0.25" value="0">
                        <input type="number" id="nb-structure-rotation" min="-180" max="180" step="0.25" value="0">
                    </div>
                </div>
            </div>
        </div>
